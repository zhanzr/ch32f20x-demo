# OpenOCD board config: f207-evt-r1 (CH32F207VCT6, Cortex-M3) through the
# on-board WCH-Link in CMSIS-DAP mode (VID:PID 1a86:8012) over SWD.
#
# Requires the WCH OpenOCD build that ships the "wch_arm" flash driver (the
# OpenOCD bundled with MounRiver Studio / WCH tools). Standard upstream
# OpenOCD has neither the wch_arm driver nor WCH SWD quirks.
#
# Usage:
#   openocd -f scripts/wch-link.cfg -c "program build/blink_hello.hex verify reset exit"

adapter driver cmsis-dap
source [find target/swj-dp.tcl]
transport select swd
adapter speed 4000

# Optional: pin the probe by serial if more than one WCH-Link is present.
#   openocd -f wch-link.cfg -c "set WCHLINK_SERIAL 05748F068A47" ...
if { [info exists WCHLINK_SERIAL] } {
    cmsis_dap_serial $WCHLINK_SERIAL
}

set _CHIPNAME ch32f207

# SWD DPIDR observed on the CH32F207VCT6 (not the CH32F1 0x1ba01477).
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -endian little -dap $_CHIPNAME.dap
$_CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0x4000 -work-area-backup 0

# 256 KB flash @ 0x08000000 (CH32F207VCT6), WCH's wch_arm flash driver.
flash bank $_CHIPNAME.flash wch_arm 0x08000000 0x40000 0 0 $_CHIPNAME.cpu

reset_config srst_nogate
cortex_m reset_config sysresetreq
